name: PocketAI Tagged Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Package Signed Release AAB & APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            echo "KEYSTORE_PATH=release-keystore.jks" >> $GITHUB_ENV
          else
            echo "No secrets.KEYSTORE_BASE64 found; generating CI self-signed release key..."
            bash scripts/generate_keystore.sh release-keystore.jks upload
            echo "KEYSTORE_PATH=release-keystore.jks" >> $GITHUB_ENV
          fi

      - name: Build Signed App Bundle (AAB) & APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :app:bundleRelease :app:assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
